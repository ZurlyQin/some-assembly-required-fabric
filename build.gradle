plugins {
    id 'fabric-loom' version '1.16.3'
    id 'maven-publish'
}
version = project.mod_version
group = project.mod_group_id
base { archivesName = 'someassemblyrequired-fabric' }
repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "maven.modrinth:farmers-delight-refabricated:${farmers_delight_version}"
    // Optional integration-test dependency, never bundled or required by the release mod.
    if (providers.gradleProperty('withMoreDelight').getOrElse('false').toBoolean()) {
        modLocalRuntime 'maven.modrinth:more-delight:sIZPOFH7'
    }
}
sourceSets.main.resources.srcDir 'src/generated/resources'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '200']
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('LICENSE') { rename { "${it}_someassemblyrequired" } } }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'someassemblyrequired-test'
        enableGameTests = true
        enableClientGameTests = false
    }
}

loom {
    runs {
        clientSmoke {
            inherit client
            name 'Client renderer smoke test'
            source sourceSets.gametest
            runDir 'run/clientSmoke'
            vmArg '-Dsomeassemblyrequired.clientSmoke=true'
        }
    }
}
